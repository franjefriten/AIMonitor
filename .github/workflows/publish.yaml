name: Publish to PyPI

on:
    workflow_dispatch:
    release:
        types: [ published ]

jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest
        steps:
            - name: Check user running the workflow
              if: github.event_name == 'workflow_dispatch' && github.actor != 'franjefriten'
              run: |
                  echo "Error running workflow! ${{ github.actor }} has no authorization"
                  exit 1

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python and .python-version file
              uses: actions/setup-python@v5
              with:
                python-version-file: '.python-version'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel uv
                  python -m pip install -r requirements.txt
                  python -m pip install .[opentelemetry,sqlite,kafka,prometheus]

            - name: Run unit tests
              run: |
                  python -m pytest tests/unit -q

            - name: Check optional dependency imports
              run: |
                  python -c "import opentelemetry, confluent_kafka, aiosqlite, prometheus_client"

            - name: Setup docker containers for integration tests on Linux
              if: runner.os == 'Linux'
              run: |
                sh ./scripts/kafka/sh/run_kafka.sh
                sh ./scripts/prometheus/sh/run_prometheus.sh

            - name: Setup docker containers for integration tests on non-Linux
              if: runner.os != 'Linux'
              run: |
                call ./scripts/kafka/bat/run_kafka.bat
                call ./scripts/prometheus/bat/run_prometheus.bat

            - name: Wait for services to be ready
              run: |
                echo "Waiting for Kafka..."
                until nc -z localhost 9092; do sleep 1; done
                echo "Kafka is ready."
                echo "Waiting for Prometheus..."
                until nc -z localhost 9090; do sleep 1; done
                until curl --fail --silent http://localhost:9090/-/healthy; do sleep 1; done
                echo "Prometheus is ready."

            - name: Run integration tests
              run: |
                python -m pytest tests/integration -m integration -q

            - name: Tear down docker containers for integration tests on Linux
              if: ${{ always() && runner.os == 'Linux' }}
              run: |
                sh ./scripts/kafka/sh/stop_kafka.sh
                sh ./scripts/prometheus/sh/stop_prometheus.sh

            - name: Tear down docker containers for integration tests on non-Linux
              if: ${{ always() && runner.os != 'Linux' }}
              run: |
                call ./scripts/kafka/bat/stop_kafka.bat
                call ./scripts/prometheus/bat/stop_prometheus.bat

    publish:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'release' && github.event.action == 'published'

        permissions:
            id-token: write
            contents: read

        environment:
            name: production
            url: https://pypi.org/project/aimonitor/

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python and .python-version file
              uses: actions/setup-python@v5
              with:
                python-version-file: '.python-version'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel uv build
                  python -m pip install -r requirements.txt
                  python -m pip install .[opentelemetry,sqlite,kafka,prometheus]

            - name: Build package
              run: |
                  python -m build

            - name: Publish to PyPI with trusted publishing
              uses: pypa/gh-action-pypi-publish@release/v1
