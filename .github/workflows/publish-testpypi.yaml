name: Publish to TestPyPI

on:
    workflow_dispatch:
    release:
        types: [ published ]

jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest
        steps:
            - name: Check user running the workflow
              if: github.event_name == 'workflow_dispatch' && github.actor != 'franjefriten'
              run: |
                  echo "Error running workflow! ${{ github.actor }} has no authorization"
                  exit 1

            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python and .python-version file
              uses: actions/setup-python@v5
              with:
                python-version-file: '.python-version'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel uv
                  python -m pip install -r requirements.txt
                  python -m pip install .[opentelemetry,sqlite,metrics,kafka,prometheus]

            - name: Run unit tests
              run: |
                  python -m pytest tests/unit -q

    testpypi_publish:
        name: Publish to TestPyPI
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'release' && github.event.action == 'published'

        permissions:
            id-token: write
            contents: read

        environment:
            name: testpypi
            url: https://test.pypi.org/project/aimonitor/

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python and .python-version file
              uses: actions/setup-python@v5
              with:
                python-version-file: '.python-version'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools wheel uv build
                  python -m pip install -r requirements.txt
                  python -m pip install .[opentelemetry,sqlite,metrics,kafka,prometheus]

            - name: Build package
              run: |
                  python -m build

            - name: Publish to TestPyPI with trusted publishing
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/