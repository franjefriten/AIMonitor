[project]
name = "ai-monitor-sdk"
version = "0.0.1"
description = "Framework modular de observabilidad para herramientas MCP"
authors = [
    {name = "Francisco Jesús Frías Tenza", email = "fj.friastenza@gmail.com"}
]
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
]
requires-python = ">=3.10, <3.15"
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
# Integrations for certain exporters
opentelemetry = ["opentelemetry-api>=1.29.0", "opentelemetry-sdk>=1.29.0"]
sqlite = [
    "aiosqlite>=0.22.1",
]
prometheus = [
    "prometheus-client>=0.26.0",
]
kafka = [
    "confluent-kafka>=2.15.0",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Configuración específica para uv si quieres optimizar bloqueos
package = true

[dependency-groups]
dev = [
    "build>=1.5.0",
    "twine>=7.0.0",
]
