version: 1
disable_existing_loggers: False
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s - %(filename)s:%(lineno)d: %(message)s"
    
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG # INFO and above (INFO, WARNING, ERROR, CRITICAL)
    formatter: standard
    stream: ext://sys.stdout
    
root:
  level: DEBUG 
  handlers: [console]